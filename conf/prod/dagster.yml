loggers:
  file_logger:
    log_level: INFO
    formatters:
      simple:
        format: "[%(asctime)s] %(levelname)s - %(message)s"
    handlers:
      - class: logging.handlers.RotatingFileHandler
        level: INFO
        formatter: simple
        filename: dagster_run_info.log
        maxBytes: 10485760 # 10MB
        backupCount: 20
        encoding: utf8
        delay: True

  console_logger:
    log_level: INFO
    formatters:
      simple:
        format: "[%(asctime)s] %(levelname)s - %(message)s"
    handlers:
      - class: logging.StreamHandler
        stream: ext://sys.stdout
        formatter: simple

executors:
  # Named per product so a factory can select one by interpolating '{product}'.
  reviews_predictor_executor:
    multiprocess:
      max_concurrent: 2
  price_predictor_executor:
    in_process:

schedules:
  daily:
    cron_schedule: "30 2 * * *"

jobs:
  # Job factories with whole-body interpolation: '{product}' binds to each
  # namespace (reviews_predictor, price_predictor) and is substituted everywhere
  # in the body, including the executor reference '{product}_executor'. The two
  # keys render four jobs, each wired to its product's executor.
  # Preview with `kedro dagster resolve-patterns -e prod`.
  "{product}__data_processing_base":
    pipeline:
      pipeline_name: data_processing
      node_namespaces:
      - "{product}"
      tags:
      - base
    loggers: ["console_logger", "file_logger"]
    executor: "{product}_executor"
    schedule: daily

  "{product}__data_science_base":
    pipeline:
      pipeline_name: data_science
      node_namespaces:
      - "{product}"
      tags:
      - base
    loggers: ["console_logger", "file_logger"]
    executor: "{product}_executor"
    schedule: daily
