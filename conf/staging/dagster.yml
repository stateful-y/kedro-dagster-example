loggers:
  file_logger:
    log_level: INFO
    formatters:
      simple:
        format: "[%(asctime)s] %(levelname)s - %(message)s"
    handlers:
      - class: logging.handlers.RotatingFileHandler
        level: INFO
        formatter: simple
        filename: dagster_run_info.log
        maxBytes: 10485760 # 10MB
        backupCount: 20
        encoding: utf8
        delay: True

  console_logger:
    log_level: INFO
    formatters:
      simple:
        format: "[%(asctime)s] %(levelname)s - %(message)s"
    handlers:
      - class: logging.StreamHandler
        stream: ext://sys.stdout
        formatter: simple

executors:
  sequential:
    in_process:

  multiprocessing:
    multiprocess:
      max_concurrent: 2

schedules:
  daily:
    cron_schedule: "30 2 * * *"

jobs:
  # Job factories: a key with a '{placeholder}' marker expands into one concrete
  # job per pipeline namespace. Here '{product}' binds to the namespaces of each
  # pipeline (reviews_predictor, price_predictor), so the two factory keys below
  # render four jobs: reviews_predictor__data_processing_candidate1,
  # price_predictor__data_processing_candidate1, and the data_science pair.
  # Preview the expansion with `kedro dagster resolve-patterns -e staging`.
  "{product}__data_processing_candidate1":
    pipeline:
      pipeline_name: data_processing
      node_namespaces:
      - "{product}"
      tags:
      - candidate1
    loggers: ["file_logger", "console_logger"]
    executor: multiprocessing
    schedule: daily

  "{product}__data_science_candidate1":
    pipeline:
      pipeline_name: data_science
      node_namespaces:
      - "{product}"
      tags:
      - candidate1
    loggers: ["file_logger", "console_logger"]
    executor: sequential
    schedule: daily
