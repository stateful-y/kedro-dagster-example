# To enable this custom logging configuration, set KEDRO_LOGGING_CONFIG to the path of this file.
# More information available at https://docs.kedro.org/en/stable/develop/logging/
# The kedro-dagster formatter classes require KEDRO_LOGGING_MODULE_ALLOWLIST=kedro_dagster.
version: 1

disable_existing_loggers: False

formatters:
  simple:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

  colored:
    class: kedro_dagster.logging.DagsterColoredFormatter

  json:
    class: kedro_dagster.logging.DagsterJsonFormatter

  rich:
    class: kedro_dagster.logging.DagsterRichFormatter

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    stream: ext://sys.stdout
    formatter: colored

  info_file_handler:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: simple
    filename: info.log
    maxBytes: 10485760 # 10MB
    backupCount: 20
    encoding: utf8
    delay: True

loggers:
  kedro:
    level: INFO

  kedro_dagster:
    level: INFO

root:
  handlers: [console, info_file_handler]
