name: Run linter and tests
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags-ignore: ["**"]
  pull_request:

permissions:
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  POSTGRES_DB: dev_db
  POSTGRES_USER: dev_user
  POSTGRES_PASSWORD: dev_password
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  PYTHON_VERSION: "3.13"
  KEDRO_LOGGING_MODULE_ALLOWLIST: kedro_dagster

jobs:
  # Cross-platform checks without DB service (services are not supported on macOS/Windows runners)
  ckeck:
    name: Linter and tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
        kedro-env:
          - local
          - staging
          - prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add .local/bin to Windows PATH
        if: matrix.os == 'windows-latest'
        shell: bash
        run: echo "$USERPROFILE/.local/bin" >> $GITHUB_PATH

      - name: Install nox
        run: uv tool install --python-preference only-managed --python ${{ env.PYTHON_VERSION }} nox

      - name: Install Python
        run: uv python install --python-preference only-managed ${{ env.PYTHON_VERSION }}

      - name: Run checks
        run: nox -s fix

      - name: Run tests
        run: nox -s "tests(kedro_env='${{ matrix.kedro-env }}')"
        env:
          DIFF_AGAINST: HEAD
          PYTEST_XDIST_AUTO_NUM_WORKERS: 0

  # Ubuntu-only matrix with a PostgreSQL service available for tests
  checks_postgres:
    name: Coverage tests with Postgres running with ${{ matrix.kedro-env}} env on ubuntu-latest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kedro-env:
          - local
          - dev
          - staging
          - prod
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dev_db
          POSTGRES_USER: dev_user
          POSTGRES_PASSWORD: dev_password
        ports:
          - 5432:5432
        # Wait until Postgres is healthy before running steps
        options: >-
          --health-cmd="pg_isready -U dev_user -d dev_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install nox
        run: uv tool install --python-preference only-managed --python ${{ env.PYTHON_VERSION }} nox

      - name: Install Python
        run: uv python install --python-preference only-managed ${{ env.PYTHON_VERSION }}

      - name: Run checks
        run: nox -s fix

      - name: Run tests with Postgres service
        run: nox -s "tests(kedro_env='${{ matrix.kedro-env }}')"
        env:
          DIFF_AGAINST: HEAD
          PYTEST_XDIST_AUTO_NUM_WORKERS: 0
